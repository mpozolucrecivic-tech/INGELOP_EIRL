# ==========================================================================
# INGELOP – producción en un solo VPS
#
#   Internet ──443──► caddy ─┬─► DOMINIO_WEB        → web (PHP/Apache)
#                            └─► DOMINIO_INTRANET   → intranet (archivos estáticos)
#                                                   → /api/* → api (Node) ──► db (PostgreSQL)
#
# Uso (desde la raíz del repositorio):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# ==========================================================================

name: ingelop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ingelop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ingelop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingelop -d ingelop"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base de datos NO queda expuesta a internet

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ingelop:${POSTGRES_PASSWORD}@db:5432/ingelop
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: https://${DOMINIO_INTRANET}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - uploads:/app/uploads   # planos y documentos subidos

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      INTRANET_URL: https://${DOMINIO_INTRANET}
      CONTACTO_EMAIL: ${CONTACTO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - web_mensajes:/var/www/html/storage   # respaldo de los mensajes del formulario

  caddy:
    build:
      context: ..
      dockerfile: deploy/intranet.Dockerfile   # Caddy + frontend compilado
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO_WEB: ${DOMINIO_WEB:?Define DOMINIO_WEB en deploy/.env}
      DOMINIO_INTRANET: ${DOMINIO_INTRANET:?Define DOMINIO_INTRANET en deploy/.env}
      EMAIL_ACME: ${EMAIL_ACME:?Define EMAIL_ACME en deploy/.env}
    volumes:
      - caddy_data:/data       # certificados HTTPS
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  web_mensajes:
  caddy_data:
  caddy_config:
